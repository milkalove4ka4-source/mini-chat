<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мини-чат</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      background: #f4f4f9;
    }
    h1 {
      color: #007acc;
    }
    #chat {
      width: 400px;
      height: 300px;
      border: 1px solid #ccc;
      background: #fff;
      overflow-y: auto;
      padding: 10px;
      margin-bottom: 10px;
    }
    #input {
      display: flex;
      width: 400px;
    }
    #message {
      flex: 1;
      padding: 5px;
    }
    button {
      padding: 5px 10px;
      background: #007acc;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <h1>Мини-чат 💬</h1>
  <div id="chat"></div>
  <div id="input">
    <input type="text" id="message" placeholder="Введите сообщение...">
    <button onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    function sendMessage() {
      const chat = document.getElementById("chat");
      const input = document.getElementById("message");
      if (input.value.trim() !== "") {
        const msg = document.createElement("p");
        msg.textContent = input.value;
        chat.appendChild(msg);
        input.value = "";
        chat.scrollTop = chat.scrollHeight; // прокрутка вниз
      }
    }
  </script>
</body>
</html>
